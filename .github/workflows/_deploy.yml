name: Reusable EAS Deploy

on:
  workflow_call:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: string
      deploy:
        description: Whether to queue an EAS build after quality checks
        required: false
        default: false
        type: boolean
      auto_submit:
        description: Whether to submit the completed build to TestFlight
        required: false
        default: false
        type: boolean
    secrets:
      EXPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  deploy:
    name: Deploy ${{ inputs.profile }} app
    if: inputs.deploy
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Queue EAS build
        if: ${{ !inputs.auto_submit }}
        env:
          BUILD_PROFILE_NAME: ${{ inputs.profile }}
        run: eas build --platform ios --profile "$BUILD_PROFILE_NAME" --non-interactive --no-wait

      - name: Queue EAS build and TestFlight submission
        if: inputs.auto_submit
        env:
          BUILD_PROFILE_NAME: ${{ inputs.profile }}
        run: eas build --platform ios --profile "$BUILD_PROFILE_NAME" --auto-submit --non-interactive --no-wait
