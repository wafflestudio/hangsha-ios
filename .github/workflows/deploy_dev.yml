name: Deploy development

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      profile: development
      deploy: ${{ github.event_name != 'pull_request' }}
      auto_submit: false
    secrets: inherit
